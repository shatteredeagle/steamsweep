# Push a tag like v0.1.0 to publish a release. Notes come from the "## 0.1.0" section of CHANGELOG.md
# (the job fails if it is missing or empty).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Release notes
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > notes.md
      - run: go vet ./... && go test ./...
      - name: Build archives
        run: bash scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "steamsweep $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
